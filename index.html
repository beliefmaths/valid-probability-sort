<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probability Sort</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  font-family: sans-serif;
  transition: background 0.3s, color 0.3s;
}

/* THEMES */
.dark { background:#0f172a; color:#f1f5f9; }
.light { background:#f8fafc; color:#0f172a; }

/* TOGGLE */
#toggleSwitch {
  width:64px;
  height:32px;
  background:#64748b;
  border-radius:999px;
  position:relative;
  cursor:pointer;
  transition:0.3s;
}
#toggleSwitch.active { background:#6366f1; }

#toggleKnob {
  position:absolute;
  top:4px;
  left:4px;
  width:24px;
  height:24px;
  background:white;
  border-radius:50%;
  transition:0.3s;
}
#toggleKnob.active {
  transform:translateX(32px);
}

/* STACK */
.stack-card {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:#fff;
  color:#0f172a;
  font-weight:600;
  border:2px solid #cbd5f5;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  cursor:grab;
}

/* ZONES */
.drop-zone.drag-over { transform:scale(1.03); }

/* SORTED */
.zone-card {
  background:#fff;
  color:#0f172a;
  border:2px solid #cbd5f5;
  border-radius:10px;
  padding:8px;
  text-align:center;
  font-weight:600;
  cursor:grab;
}

/* TABLE */
table {
  width:100%;
  border-collapse:collapse;
}
td, th {
  border:1px solid #64748b;
  padding:8px;
}
th {
  background:#334155;
}
</style>
</head>

<body class="dark p-6">

<!-- TOGGLE -->
<div class="flex justify-end mb-4">
  <div class="flex items-center gap-3">
    <span id="modeLabel" class="text-lg font-semibold">Dark Mode</span>
    <div id="toggleSwitch">
      <div id="toggleKnob"></div>
    </div>
  </div>
</div>

<h1 class="text-3xl font-bold text-center mb-4">Probability Sort</h1>
<p class="text-center mb-6">Sort into valid and invalid probabilities</p>

<!-- CARD STACK -->
<div id="card-pool" class="relative mx-auto mb-10" style="width:280px;height:160px;"></div>

<!-- ZONES -->
<div class="grid grid-cols-2 gap-6 max-w-xl mx-auto">
  <div id="zone-valid" class="drop-zone border-2 border-green-400 p-4 rounded">
    <h2 class="mb-2 font-bold text-green-400">Valid</h2>
    <div id="zone-valid-cards" class="grid grid-cols-2 gap-2"></div>
  </div>

  <div id="zone-invalid" class="drop-zone border-2 border-red-400 p-4 rounded">
    <h2 class="mb-2 font-bold text-red-400">Invalid</h2>
    <div id="zone-invalid-cards" class="grid grid-cols-2 gap-2"></div>
  </div>
</div>

<div class="text-center mt-6">
  <button id="check-btn" onclick="checkAnswers()" disabled
    class="bg-indigo-500 border-2 border-indigo-300 px-6 py-2 rounded font-bold">
    Check Answers
  </button>
</div>

<div id="results" class="mt-6 max-w-2xl mx-auto"></div>

<script>
const TOTAL_CARDS = 10;

let cards = [];
let sorted = { valid: [], invalid: [] };
let draggedId = null;

/* ---------- THEME TOGGLE ---------- */

const toggleSwitch = document.getElementById("toggleSwitch");
const toggleKnob = document.getElementById("toggleKnob");
const modeLabel = document.getElementById("modeLabel");

toggleSwitch.addEventListener("click", () => {

  const isLight = document.body.classList.contains("light");

  if (isLight) {
    document.body.classList.remove("light");
    document.body.classList.add("dark");

    toggleSwitch.classList.remove("active");
    toggleKnob.classList.remove("active");

    modeLabel.textContent = "Dark Mode";

  } else {
    document.body.classList.remove("dark");
    document.body.classList.add("light");

    toggleSwitch.classList.add("active");
    toggleKnob.classList.add("active");

    modeLabel.textContent = "Light Mode";
  }
});

/* ---------- PROBABILITY ---------- */

function parseProbability(label) {
  if (label.includes(':')) return NaN;

  if (label.includes('/')) {
    const [n,d] = label.split('/').map(Number);
    if (d === 0) return NaN;
    return n/d;
  }

  if (label.includes('%')) return parseFloat(label)/100;

  return parseFloat(label);
}

function isValidProbability(label) {
  const v = parseProbability(label);
  return !isNaN(v) && v >= 0 && v <= 1;
}

function getReason(label) {
  if (label.includes(':')) return "Probability cannot be represented as a ratio";

  const v = parseProbability(label);

  if (isNaN(v)) return "Not a valid number";
  if (v < 0) return "Probability cannot be negative";
  if (v > 1) return "Probability cannot exceed 1";
  if (v === 0) return "0 is valid as it means impossible";
  if (v === 1) return "1 is valid as it means certain";

  return "Valid probability (between 0 and 1)";
}

/* ---------- CARDS ---------- */

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

function generateCards() {

  const validPool = ["0","1","0.5","0.25","0.75","1/2","3/4","0.99"];
  const invalidPool = ["1.5","-0.5","2","5/4","150%","-1","3:4","2:5","7:3"];

  const numValid = Math.floor(Math.random()*3)+4;
  const numInvalid = TOTAL_CARDS - numValid;

  const selected = [
    ...shuffle(validPool).slice(0,numValid),
    ...shuffle(invalidPool).slice(0,numInvalid)
  ];

  return shuffle(selected).map((label,i)=>({
    id:"c"+i,
    label,
    valid:isValidProbability(label),
    reason:getReason(label)
  }));
}

/* ---------- MOVE ---------- */

function moveCard(id, zone) {
  sorted.valid = sorted.valid.filter(x=>x!==id);
  sorted.invalid = sorted.invalid.filter(x=>x!==id);
  sorted[zone].push(id);
  render();
}

/* ---------- RENDER ---------- */

function render() {
  renderPool();
  renderZone("valid");
  renderZone("invalid");
  updateButton();
}

function renderPool() {
  const pool = document.getElementById("card-pool");
  pool.innerHTML="";

  const unsorted = shuffle(cards.filter(c =>
    !sorted.valid.includes(c.id) &&
    !sorted.invalid.includes(c.id)
  ));

  unsorted.forEach((c,i)=>{
    const el=document.createElement("div");
    el.className="stack-card";
    el.textContent=c.label;
    el.draggable=true;
    el.dataset.id=c.id;

    el.style.transform=`translate(${i*4}px,${i*4}px)`;

    el.addEventListener("dragstart", e=>{
      draggedId=e.target.dataset.id;
    });

    pool.appendChild(el);
  });
}

function renderZone(zone) {
  const container=document.getElementById(`zone-${zone}-cards`);
  container.innerHTML="";

  sorted[zone].forEach(id=>{
    const c=cards.find(x=>x.id===id);

    const el=document.createElement("div");
    el.className="zone-card";
    el.textContent=c.label;
    el.draggable=true;
    el.dataset.id=c.id;

    el.addEventListener("dragstart", e=>{
      draggedId=e.target.dataset.id;
    });

    container.appendChild(el);
  });
}

/* ---------- DRAG ---------- */

document.querySelectorAll(".drop-zone").forEach(zone=>{
  zone.addEventListener("dragover", e=>{
    e.preventDefault();
    zone.classList.add("drag-over");
  });

  zone.addEventListener("dragleave", ()=>{
    zone.classList.remove("drag-over");
  });

  zone.addEventListener("drop", e=>{
    e.preventDefault();
    zone.classList.remove("drag-over");

    if (!draggedId) return;

    const type = zone.id==="zone-valid" ? "valid":"invalid";
    moveCard(draggedId,type);
  });
});

/* ---------- CHECK ---------- */

function updateButton() {
  const total = sorted.valid.length + sorted.invalid.length;
  document.getElementById("check-btn").disabled = total < TOTAL_CARDS;
}

function checkAnswers() {

  let score=0;
  let wrong=[];

  cards.forEach(c=>{
    const user = sorted.valid.includes(c.id);
    if (user===c.valid) score++;
    else wrong.push({card:c,user});
  });

  let message = "";

  if (score === TOTAL_CARDS) message = "🎉 Perfect Score!";
  else if (score >= 8) message = "👏 Well done! Can you try again for a perfect score?";
  else if (score >= 4) message = "👍 Good effort! Keep practicing to get a perfect score.";
  else message = "💪 More practice needed. Review the lesson and try again.";

  let html = `
    <div class="text-center mb-4">
      <h2 class="text-3xl font-bold">${score}/${TOTAL_CARDS}</h2>
      <p class="text-lg mt-1">${message}</p>
    </div>
  `;

  if (wrong.length>0){
    html += `<table>
      <tr>
        <th>Value</th>
        <th>Your Answer</th>
        <th>Explanation</th>
      </tr>`;

    wrong.forEach(w=>{
      html += `<tr>
        <td>${w.card.label}</td>
        <td>${w.user ? "Valid":"Invalid"}</td>
        <td>${w.card.reason}</td>
      </tr>`;
    });

    html += `</table>`;
  }

  html += `<div class="text-center mt-6">
    <button onclick="reset()" 
      class="bg-indigo-500 border-2 border-indigo-200 px-6 py-3 rounded text-lg font-bold">
      Try Again
    </button>
  </div>`;

  document.getElementById("results").innerHTML=html;
}

/* ---------- RESET ---------- */

function reset() {
  cards=generateCards();
  sorted={valid:[],invalid:[]};
  document.getElementById("results").innerHTML="";
  render();
}

/* ---------- INIT ---------- */

cards=generateCards();
render();
</script>

</body>
</html>
